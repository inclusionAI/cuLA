
[build-system]
requires = ["setuptools>=61", "wheel", "setuptools_scm>=6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cula"
dynamic = ["version"]
description = "cuLA CUDA extension"
readme = "README.md"
authors = [ { name = "cula contributors" } ]
requires-python = ">=3.8"
dependencies = [
    "nvidia-cutlass-dsl==4.4.2",
    "apache-tvm-ffi==0.1.9",
    "pytest",
    "matplotlib",
    "pandas",
]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["."]
include = ["cula"]

[tool.setuptools_scm]
# write generated version into package for runtime access
write_to = "cula/_version.py"
# add a date-based local suffix when needed
local_scheme = "node-and-date"
# fallback for non-git sources
fallback_version = "0.1.0"
