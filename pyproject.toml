
[build-system]
requires = ["setuptools>=61", "wheel", "setuptools_scm>=6.0"]
build-backend = "setuptools.build_meta"
# Note: torch is required at build time but must be pre-installed with correct CUDA version.
# Do NOT add torch here to avoid pip downloading wrong CUDA version from PyPI.
# Install torch manually: pip install torch --index-url https://download.pytorch.org/whl/cu129

# NOTE: project metadata (name, deps, etc.) is intentionally NOT declared here.
# The package name is computed dynamically in setup.py based on the NVCC version
# (e.g. ant-cuda-linear-attention-cu129). PEP 621 forbids `name` from being dynamic
# in [project], so we omit the [project] table entirely and let setuptools read
# everything from setup.py.

[tool.ruff]
target-version = "py312"
line-length = 127
exclude = [
    "csrc/",
    "third_party/",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # Pyflakes
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "I",    # isort
    "C4",   # flake8-comprehensions
    "TCH",  # flake8-type-checking
    "T",    # flake8-debugger
]
ignore = [
    "E501",
    "E741",
    "B023",
    "B006",
    "B007",
    "B008",
    "B028",
    "B904",
    "B905",
    "C408",
    "C416",
    "C417",
    "T201",
    "TC002",
    "TC003",
    "SIM102",
    "SIM108",
    "SIM118",
    "SIM211",
    "COM812",
]

[tool.ruff.lint.isort]
known-first-party = ["cula"]
force-sort-within-sections = false

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"cula/_version.py" = ["UP007"]
# TODO: fix undefined names (exp_g, chunk_kda_bwd_dqkwg) — WIP code
"cula/ops/kda_fully_fused.py" = ["F821"]
"cula/ops/kda_fully_fused_wip.py" = ["F821"]
"cula/kda/blackwell_fused_fwd.py" = ["F821"]

# setuptools_scm config moved to setup.py (use_scm_version=...) since the
# [project] table was removed; keeping a single source of truth there.