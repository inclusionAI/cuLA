# CodeRabbit repository configuration:
# https://docs.coderabbit.ai/reference/configuration
language: "en-US"

reviews:
  profile: "chill"
  request_changes_workflow: false

  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true

  path_filters:
    - "!csrc/cutlass/**"
    - "!third_party/**"

  path_instructions:
    - path: "csrc/**"
      instructions: |
        Review CUDA changes for synchronization and memory-ordering correctness,
        shared-memory and barrier lifetimes, out-of-bounds access, divergence,
        architecture guards, numerical precision, and concrete performance regressions.

    - path: "cula/**"
      instructions: |
        Review CuTe DSL kernels and Python APIs for architecture dispatch,
        dtype/layout/shape validation, numerical precision, error handling,
        compile-cache behavior, and concrete performance regressions.

    - path: "tests/**"
      instructions: |
        Check that tests cover changed behavior and boundary cases without adding
        redundant CUDA compilation matrices or pushing the default suite beyond
        its roughly five-minute target.
