name: Build & Release Wheel

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-wheel:
    name: wheel / py3-none-any
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade build setuptools wheel setuptools_scm

      - name: Compute version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            BASE="${GITHUB_REF#refs/tags/v}"
          else
            BASE=$(python -c "from setuptools_scm import get_version; print(get_version().split('+')[0])")
          fi
          echo "version=${BASE}" >> "$GITHUB_OUTPUT"

      - name: Build wheel
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: "${{ steps.version.outputs.version }}"
        run: python -m build --wheel --outdir dist

      - name: Verify wheel
        shell: bash
        run: |
          python -m pip install --no-deps dist/*.whl
          python -c "import cula; print(cula.__version__)"
          ls dist/*.whl | grep -q -- '-py3-none-any.whl$' \
            || { echo "ERROR: wheel is not platform-independent"; exit 1; }

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v6
        with:
          name: wheel-py3-none-any
          path: dist/*.whl

  release:
    name: Create GitHub Release
    needs: [build-wheel]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download wheel
        uses: actions/download-artifact@v6
        with:
          path: artifacts/

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/wheel-py3-none-any/*.whl
          generate_release_notes: true
          draft: true
          prerelease: ${{ contains(github.ref, 'rc') || contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}
