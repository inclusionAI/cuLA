version: "2.0"

stages:
  - 环境变量准备
  - image-build
  - 前置校验
  - 构建

jobs:
  variableExport:
    stage: 环境变量准备
    id: envprepare
    component: shell-with-clone-and-output
    inputs:
      script: |
        add_output output "ACI-v$(date +'%Y%m%d-%H%M%S')-$(git log -1 --pretty=format:%h)"

  镜像构建:
    stage: image-build
    id: build
    component: docker-image-build
    inputs:
      nydusSwitch: true # 启用 Nydus 镜像构建（可不填，默认为 true）
      imageName: reg.antgroup-inc.cn/ling/flashla-dev
      imageTag: ${{jobs.envprepare.outputs.output}}
      dockerfile: dockerfiles/fast-cu130.Dockerfile
      contextDir: ./

  python-format-check:
    stage: 前置校验
    component: python-ruff-check
    inputs:
      resourceClass: "S"
      ruff_version: 0.15.0
      script: |
        export UV_LINK_MODE=copy
        export UV_NO_PROGRESS=1

        # Debug: show current directory structure
        echo "=== Current Working Directory ==="
        pwd
        echo ""
        echo "=== Directory Structure ==="
        ls -la
        echo ""

        # The Docker image already has all dependencies installed
        echo "=== Installed ruff version ==="
        ruff --version

  cpp-format-check:
    stage: 前置校验
    component: shell-with-clone
    inputs:
      resourceClass: "S"
      image: aone-base-global/flashla-dev:clang-format-15
      script: |
        set -o pipefail
        cd ${CODE_WORKSPACE}
        clang-format --version

        format_output=$(find csrc -path csrc/cutlass -prune -o -path csrc/kerutils -prune -o \( -name '*.cu' -o -name '*.cuh' -o -name '*.cpp' -o -name '*.h' -o -name '*.hpp' \) -print \
          | xargs clang-format --dry-run --Werror 2>&1)
        format_rc=$?

        if [ $format_rc -ne 0 ]; then
          web_output="<h3>检查失败 ❌</h3>"
          web_output+="<p>请根据以下输出修复代码格式问题：</p>"
          web_output+="<h4>clang-format</h4><pre>$format_output</pre>"
          add_output webOutput "$web_output"
          exit 1
        else
          web_output="<h3>检查通过 🎉</h3>"
          web_output+="<p>所有 C++/CUDA 代码格式检查均已通过！</p>"
          add_output webOutput "$web_output"
        fi

  build-and-upload-wheel-cu129:
    stage: 构建
    component: pypi-artifact-uploader
    inputs:
      # CUDA 环境镜像（包含 PyTorch + CUDA 12.9）
      buildImage: reg.antgroup-inc.cn/ling/flashla-dev:ACI-v20260526-111049-7ebd48e_nydus_v2
      # 自定义构建命令（关键：--no-isolation 避免 CUDA 版本冲突，Gitee 下载 CUTLASS）
      buildCmd: |
        export CULA_CUTLASS_URL="https://gitee.com/yunfeiliu/cutlass/repository/archive/v4.4.0.zip"
        VERSION_RC=0
        VERSION="$(bash scripts/prepare_aci_release_version.sh)" || VERSION_RC=$?
        if [ "${VERSION_RC}" -eq 0 ]; then
          export SETUPTOOLS_SCM_PRETEND_VERSION="${VERSION}"
          echo "[cu129] SETUPTOOLS_SCM_PRETEND_VERSION=${SETUPTOOLS_SCM_PRETEND_VERSION}"
        elif [ "${VERSION_RC}" -eq 1 ]; then
          echo "[cu129] no release tag found; using setuptools_scm development version"
        else
          exit "${VERSION_RC}"
        fi
        pip install build wheel setuptools_scm -q -i https://artifacts.antgroup-inc.cn/artifact/repositories/simple/
        CULA_DISABLE_SM100=1 CULA_DISABLE_SM103=1 CULA_DISABLE_SM90=0 python -m build --wheel --no-isolation
      # 上传到内部 PyPI（需要配置 uploadUser/uploadToken 环境变量）
      registry: "https://artifacts.antgroup-inc.cn/artifact/repositories/simple-dev"
      # 构建超时（编译 CUTLASS + CUDA 扩展较耗时）
      timeoutInSec: "3600"

  build-and-upload-wheel-cu130:
    stage: 构建
    component: pypi-artifact-uploader
    inputs:
      # CUDA 环境镜像（包含 PyTorch + CUDA 13.0）
      buildImage: reg.antgroup-inc.cn/ling/flashla-dev:ACI-v20260529-205749-96543a3_nydus_v2
      # 自定义构建命令（关键：--no-isolation 避免 CUDA 版本冲突，Gitee 下载 CUTLASS）
      buildCmd: |
        export CULA_CUTLASS_URL="https://gitee.com/yunfeiliu/cutlass/repository/archive/v4.4.0.zip"
        VERSION_RC=0
        VERSION="$(bash scripts/prepare_aci_release_version.sh)" || VERSION_RC=$?
        if [ "${VERSION_RC}" -eq 0 ]; then
          export SETUPTOOLS_SCM_PRETEND_VERSION="${VERSION}"
          echo "[cu130] SETUPTOOLS_SCM_PRETEND_VERSION=${SETUPTOOLS_SCM_PRETEND_VERSION}"
        elif [ "${VERSION_RC}" -eq 1 ]; then
          echo "[cu130] no release tag found; using setuptools_scm development version"
        else
          exit "${VERSION_RC}"
        fi
        pip install build wheel setuptools_scm -q -i https://artifacts.antgroup-inc.cn/artifact/repositories/simple/
        CULA_DISABLE_SM100=0 CULA_DISABLE_SM103=1 CULA_DISABLE_SM90=1 python -m build --wheel --no-isolation
      # 上传到内部 PyPI（需要配置 uploadUser/uploadToken 环境变量）
      registry: "https://artifacts.antgroup-inc.cn/artifact/repositories/simple-dev"
      # 构建超时（编译 CUTLASS + CUDA 扩展较耗时）
      timeoutInSec: "3600"

  build-and-upload-wheel-cu130-pytorch312:
    stage: 构建
    component: pypi-artifact-uploader
    inputs:
      # CUDA 13.0 + PyTorch 2.12 / Python 3.12 快速构建镜像
      buildImage: reg.antgroup-inc.cn/ling/flashla-dev:ACI-v20260713-103650-f9f7eee_nydus_v2
      # 自定义构建命令（关键：--no-isolation 避免 CUDA 版本冲突，Gitee 下载 CUTLASS）
      buildCmd: |
        export CULA_CUTLASS_URL="https://gitee.com/yunfeiliu/cutlass/repository/archive/v4.4.0.zip"
        VERSION_RC=0
        VERSION="$(bash scripts/prepare_aci_release_version.sh)" || VERSION_RC=$?
        if [ "${VERSION_RC}" -eq 0 ]; then
          export SETUPTOOLS_SCM_PRETEND_VERSION="${VERSION}"
          echo "[cu130-pytorch312] SETUPTOOLS_SCM_PRETEND_VERSION=${SETUPTOOLS_SCM_PRETEND_VERSION}"
        elif [ "${VERSION_RC}" -eq 1 ]; then
          echo "[cu130-pytorch312] no release tag found; using setuptools_scm development version"
        else
          exit "${VERSION_RC}"
        fi
        pip install build wheel setuptools_scm -q -i https://artifacts.antgroup-inc.cn/artifact/repositories/simple/
        CULA_DISABLE_SM100=0 CULA_DISABLE_SM103=1 CULA_DISABLE_SM90=1 python -m build --wheel --no-isolation
      # 上传到内部 PyPI（需要配置 uploadUser/uploadToken 环境变量）
      registry: "https://artifacts.antgroup-inc.cn/artifact/repositories/simple-dev"
      # 构建超时（编译 CUTLASS + CUDA 扩展较耗时）
      timeoutInSec: "3600"
