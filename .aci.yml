version: "2.0"

stages:
  - 环境变量准备
  - 前置校验


jobs:

  代码format检测:
    stage: 前置校验
    component: python-ruff-check
    inputs:
      resourceClass: "S"
      ruff_version: 0.15.0
      script: |
        export UV_LINK_MODE=copy
        export UV_NO_PROGRESS=1

        # Debug: show current directory structure
        echo "=== Current Working Directory ==="
        pwd
        echo ""
        echo "=== Directory Structure ==="
        ls -la
        echo ""

        # The Docker image already has all dependencies installed
        echo "=== Installed ruff version ==="
        ruff --version
